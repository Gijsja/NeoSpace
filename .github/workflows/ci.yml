name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Patch requirements.txt to resolve Flask 3.1.2 dependency conflicts
          sed -i 's/blinker==1.7.0/blinker>=1.9.0/' requirements.txt
          sed -i 's/Werkzeug==3.0.3/Werkzeug>=3.1.3/' requirements.txt
          sed -i 's/itsdangerous==2.1.2/itsdangerous>=2.2.0/' requirements.txt
          # Explicitly install tinycss2 as it is required by bleach but not bundled in 6.0+
          pip install tinycss2
          pip install -r requirements.txt
          pip install -r requirements-test.txt

      - name: Run tests with coverage
        run: pytest -v --tb=short --cov=. --cov-report=term-missing --cov-fail-under=68

      - name: Security scan (Bandit)
        run: bandit -r . -x ./.venv,./tests,./docs --skip B101

      - name: Dependency scan (Safety)
        run: safety scan --non-interactive

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Python syntax
        run: python -m py_compile app.py db.py sockets.py auth.py core/*.py
